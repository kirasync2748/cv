<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>Your Name — Curriculum Vitae</title>

  <meta property="og:title" content="Your Name — Curriculum Vitae">
  <meta property="og:description" content="Software Engineer — Distributed Systems & Open Source">
  <meta property="og:url" content="https://your-username.github.io/cv/">
  <meta property="og:image" content="https://your-username.github.io/cv/preview.webp">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="en_GB">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">

  <style>
    :root {
      --bg: #0f1117;
      --surface: #181b24;
      --accent: #7c9eff;
      --text: #e4e7ec;
      --muted: #8b90a0;
      --border: #2a2e3a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: centre;
      padding: 2rem;
    }

    .card {
      max-width: 540px;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 3rem 2.5rem;
      text-align: centre;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }

    .tagline {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }

    .btn {
      display: block;
      padding: 0.85rem 1.5rem;
      border-radius: 10px;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .btn:hover { transform: translateY(-1px); }

    .btn-primary {
      background: var(--accent);
      color: #0f1117;
    }

    .btn-secondary {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: centre;
      gap: 0.5rem 1.25rem;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .meta a {
      color: var(--muted);
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .meta a:hover { color: var(--accent); }

    .separator {
      color: var(--border);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Your Name</h1>
    <p class="tagline">Software Engineer — Distributed Systems &amp; Open Source</p>

    <div class="links">
      <a class="btn btn-primary" href="your-name-cv.pdf">Download CV — LaTeX</a>
      <a class="btn btn-secondary" href="your-name-cv-typst.pdf">Download CV — Typst</a>
    </div>

    <div class="meta">
      <span>Your City, Country</span>
      <span class="separator">·</span>
      <a href="mailto:your.email@example.com">your.email@example.com</a>
      <span class="separator">·</span>
      <a href="#">your-github</a>
      <span class="separator">·</span>
      <a href="#">your-linkedin</a>
    </div>
  </div>
</body>
</html>
